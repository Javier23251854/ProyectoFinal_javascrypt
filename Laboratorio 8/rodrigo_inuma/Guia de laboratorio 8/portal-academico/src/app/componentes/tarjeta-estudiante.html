<article class="card h-100" [class.border-primary]="seleccionado()">
  <div class="card-body">
    <h2 class="h5 card-title">{{ estudiante().nombre }}</h2>

    <p class="text-muted mb-3">
      {{ estudiante().programa }}
    </p>

    <dl class="row mb-3">
      <dt class="col-sm-6">Promedio</dt>
      <dd class="col-sm-6">
        {{ estudiante().promedio | number: '1.2-2' }}
      </dd>

      <dt class="col-sm-6">Asistencia</dt>
      <dd class="col-sm-6">
        {{ estudiante().asistencia / 100 | percent: '1.0-0' }}
      </dd>

      <dt class="col-sm-6">Estado académico</dt>
      <dd class="col-sm-6">
        {{ estudiante().promedio | estadoAcademico }}
      </dd>
    </dl>

    <button
      type="button"
      class="btn btn-outline-primary"
      [attr.aria-pressed]="seleccionado()"
      [attr.aria-label]="'Seleccionar a ' + estudiante().nombre"
      (click)="seleccionar.emit(estudiante())"
    >
      {{ seleccionado() ? 'Seleccionado' : 'Seleccionar' }}
    </button>
  </div>
</article>
